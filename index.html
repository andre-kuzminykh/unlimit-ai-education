<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimit AI Education</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        unlimit: {
                            bg: '#ffffff',
                            text: '#0f172a',
                            textLight: '#475569',
                            lime: '#bef264',
                            limeDark: '#65a30d',
                            teal: '#2dd4bf',
                            cyan: '#67e8f9',
                            purple: '#7c3aed',
                            purpleLight: '#c4b5fd',
                        }
                    },
                    fontFamily: {
                        mono: ['"Space Mono"', 'monospace'],
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeIn: {
                            from: { opacity: 0, transform: 'translateY(10px)' },
                            to: { opacity: 1, transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #ffffff;
            color: #0f172a;
            overflow-x: hidden;
        }

        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: -10;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .visual-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .visual-card:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: #bef264;
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.1);
        }

        .text-gradient-purple {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-font {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            letter-spacing: -0.05em;
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-unlimit-lime selection:text-unlimit-text min-h-screen flex flex-col relative">

    <!-- Fluid Background -->
    <div class="aurora-bg pointer-events-none">

        <div class="absolute bottom-[-20%] left-[-10%] w-[50%] h-[50%] bg-gradient-to-t from-unlimit-cyan to-unlimit-teal opacity-30 rounded-full blur-[100px] animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute top-[40%] left-[40%] w-[30%] h-[30%] bg-unlimit-purpleLight opacity-20 rounded-full blur-[80px] animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-50 w-full px-6 py-4 glass-panel border-b-0 border-white/40 shadow-sm transition-all duration-300">

                <span class="logo-font text-xl md:text-2xl font-bold text-slate-800 tracking-tight">Unlimit <span class="text-unlimit-purple">AI Education</span></span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 py-8 md:py-12 relative z-30">
        
        <div id="home-view" class="space-y-20 animate-fade-in">
            <!-- ================= ROLES VIEW (Learning Paths) ================= -->
            <div>
                <div class="text-center mb-12 md:mb-16">
                    <h2 class="text-4xl md:text-5xl font-extrabold text-slate-900 drop-shadow-sm mb-4">Learn AI by Role</h2>
                    <p class="text-lg text-slate-600 font-mono">Select a role to discover curated AI tools and learning paths.</p>
                </div>
                <div id="roles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                    <!-- Role cards injected here -->
                </div>
            </div>

            <!-- ================= WEBINARS VIEW ================= -->
            <div>
                <div class="text-center mb-12 md:mb-16">
                    <h2 class="text-4xl md:text-5xl font-extrabold text-slate-900 drop-shadow-sm mb-4">Internal Webinars & Courses</h2>
                    <p class="text-lg text-slate-600 font-mono">Exclusive resources and recordings from our team.</p>
                </div>
                <div id="webinars-container" class="space-y-10">
                    <!-- Webinars injected here -->
                </div>
            </div>
        </div>

        <!-- ================= TOOLS VIEW (Inside a Role) ================= -->
        <div id="tools-view" class="hidden animate-fade-in">
            <div class="mb-8">
                <button onclick="showHome()" class="flex items-center text-unlimit-purple font-semibold hover:text-indigo-800 transition-colors bg-white/50 px-4 py-2 rounded-lg backdrop-blur-sm border border-white">
                    <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i>
                    Back to Home
                </button>
            </div>
            <div class="mb-12 glass-panel p-8 rounded-2xl flex flex-col md:flex-row items-center md:items-start gap-6">
                <div id="tools-role-icon" class="p-4 bg-white rounded-xl shadow-sm text-unlimit-teal border border-slate-100 shrink-0">
                    <!-- Icon injected here -->
                </div>
                <div>
                    <h2 id="tools-view-title" class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-2"></h2>
                    <p id="tools-view-desc" class="text-lg text-slate-600 font-medium"></p>
                </div>
            </div>
            <div id="tools-container" class="space-y-12">
                <!-- Tool sections injected here -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="glass-panel border-t border-white/50 mt-auto py-6 relative z-30">
        <div class="container mx-auto text-center text-slate-500 font-mono text-sm">
            <p>&copy; 2026 Unlimit. Transform the way you work.</p>
        </div>
    </footer>

        const webinarsData = [
            {
            category: "AI Automation Bootcamp",
            icon: "graduation-cap",
            description: "A comprehensive 4-part series on transitioning to an AI-First operating model and building intelligent agents.",
            items: [

        {
            category: "Engineering & Development",
                icon: "code",
                description: "Deep technical sessions on software architecture, code generation, and product development with AI.",
                items: [
                    { title: "AI Tooling Demo for Devs", url: "https://drive.google.com/file/d/1-RU6YXeiWfMW_afeUKif0bultCnJMbjr/view", desc: "Experience sharing on using AI tools for coding, discussing tech stacks, and how effective prompts and detailed documentation speed up development from architecture to real-time monitoring." },

            {
                category: "Productivity & Operations",
                icon: "workflow",
                description: "Workflows and implementations designed to accelerate day-to-day work.",
                items: [
                    { title: "Build a Personal Assistant in n8n", url: "https://drive.google.com/file/d/1V4Md0Nn18wztQcD8Hgt-Wv1yH-bwX2c3/view", desc: "Step-by-step guide on creating your own fully functional personal assistant using n8n workflows." },

        // --- DOM ELEMENTS ---
    const views = {
        home: document.getElementById('home-view'),
        tools: document.getElementById('tools-view')
    };
    const rolesGrid = document.getElementById('roles-grid');
    const toolsContainer = document.getElementById('tools-container');
    const webinarsContainer = document.getElementById('webinars-container');

    // --- CORE FUNCTIONS ---

    function showHome() {
        views.tools.classList.add('hidden');
        views.home.classList.remove('hidden');
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
        lucide.createIcons();
    }

    function showTools(roleName) {
        renderToolsView(roleName);
        views.home.classList.add('hidden');
        views.tools.classList.remove('hidden');
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
        lucide.createIcons();
    }

    // --- RENDER FUNCTIONS ---

    function renderRolesView() {
            rolesGrid.innerHTML = ''; 
            let delay = 0;
            for (const [roleName, role] of Object.entries(educationData)) {
                const card = document.createElement('div');
                card.className = `visual-card glass-panel p-8 rounded-2xl cursor-pointer flex flex-col items-center text-center animate-fade-in`;
                card.style.animationDelay = `${delay}ms`;
                card.innerHTML = `
                    <div class="mb-5 w-16 h-16 rounded-2xl bg-white border border-slate-100 flex items-center justify-center text-unlimit-teal shadow-sm group-hover:scale-110 transition-transform">
                        <i data-lucide="${role.icon}" class="w-8 h-8"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-slate-900 mb-3 tracking-tight">${roleName}</h3>
                    <p class="text-slate-600 font-medium leading-relaxed">${role.description}</p>
                    <div class="mt-6 text-sm font-bold text-unlimit-purple flex items-center gap-1 opacity-80 group-hover:opacity-100 transition-opacity">
                        Explore Tools <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </div>
                `;
                card.onclick = () => showTools(roleName);
                rolesGrid.appendChild(card);
                delay += 50;
            }
        }

        function renderToolsView(roleName) {
            const role = educationData[roleName];
            
            document.getElementById('tools-view-title').textContent = `${roleName} Toolkit`;
            document.getElementById('tools-view-desc').textContent = role.description;
            document.getElementById('tools-role-icon').innerHTML = `<i data-lucide="${role.icon}" class="w-10 h-10"></i>`;
            
            toolsContainer.innerHTML = ''; 
            
            let delay = 0;
            for (const [toolName, tool] of Object.entries(role.tools)) {
                const section = document.createElement('div');
                section.className = "animate-fade-in";
                section.style.animationDelay = `${delay}ms`;
                
                const lessonsHtml = tool.lessons.map(lesson => `
                    <a href="${lesson.url}" target="_blank" rel="noopener noreferrer" class="block visual-card p-6 rounded-xl hover:border-unlimit-lime transition-all duration-300 h-full flex flex-col group">
                        <div class="flex items-start gap-4">
                            <div class="p-2 bg-white rounded-lg shadow-sm shrink-0 border border-slate-100 text-unlimit-teal group-hover:bg-unlimit-teal group-hover:text-white transition-colors">
                                <i data-lucide="play-circle" class="w-5 h-5"></i>
                            </div>
                            <div class="flex-grow">
                                <h4 class="text-lg font-bold text-slate-800 leading-tight mb-2 group-hover:text-unlimit-purple transition-colors">${lesson.title}</h4>
                                <p class="text-sm text-slate-600 font-medium leading-relaxed">${lesson.desc}</p>
                            </div>
                            <div class="shrink-0 text-slate-300 group-hover:text-unlimit-purple transition-colors">
                               <i data-lucide="external-link" class="w-5 h-5"></i>
                            </div>
                        </div>
                    </a>
                `).join('');

                section.innerHTML = `
                    <div class="flex items-center mb-6 pl-2"> 
                        <div class="w-10 h-10 mr-4 rounded-xl bg-white border border-slate-200 shadow-sm flex items-center justify-center overflow-hidden shrink-0">
                            <img src="${tool.icon}" alt="${toolName}" class="w-6 h-6 object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                            <i data-lucide="${tool.lucideIcon || 'box'}" class="w-5 h-5 text-slate-500 hidden"></i>
                        </div>
                        <h3 class="text-2xl font-extrabold text-slate-800 tracking-tight">${toolName}</h3>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                        ${lessonsHtml}
                    </div>
                `;
                toolsContainer.appendChild(section);
                delay += 100;
            }
        }

        function renderWebinarsView() {
            webinarsContainer.innerHTML = '';
            let delay = 0;
            
            webinarsData.forEach(category => {
                const section = document.createElement('div');
                section.className = "glass-panel p-8 md:p-10 rounded-2xl animate-fade-in";
                section.style.animationDelay = `${delay}ms`;
                
                const itemsHtml = category.items.map(item => `
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="visual-card p-5 rounded-xl flex flex-col md:flex-row md:items-center gap-4 group">
                        <div class="p-3 bg-white border border-slate-100 rounded-xl text-unlimit-purple shadow-sm shrink-0 group-hover:bg-unlimit-purple group-hover:text-white transition-all">
                            <i data-lucide="video" class="w-6 h-6"></i>
                        </div>
                        <div class="flex-grow">
                            <h4 class="text-xl font-bold text-slate-800 mb-1 group-hover:text-unlimit-purple transition-colors">${item.title}</h4>
                            <p class="text-sm text-slate-600 font-medium">${item.desc}</p>
                        </div>
                        <div class="shrink-0 text-slate-300 group-hover:text-unlimit-teal hidden md:block transition-colors">
                            <i data-lucide="arrow-right" class="w-6 h-6"></i>
                        </div>
                    </a>
                `).join('');

                section.innerHTML = `
                    <div class="flex items-center gap-4 mb-3">
                        <div class="p-2 bg-unlimit-lime/20 rounded-lg border border-unlimit-lime/50 text-unlimit-limeDark">
                            <i data-lucide="${category.icon}" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">${category.category}</h3>
                    </div>
                    <p class="text-slate-600 mb-8 font-medium pl-14">${category.description}</p>
                    <div class="space-y-4">
                        ${itemsHtml}
                    </div>
                `;
                webinarsContainer.appendChild(section);
            delay += 150;
        });
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        renderRolesView();
        renderWebinarsView();
        showHome();
    });

</script>
</body>
</html>
